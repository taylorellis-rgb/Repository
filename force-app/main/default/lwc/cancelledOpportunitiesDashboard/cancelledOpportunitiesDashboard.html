<template>
    <lightning-card title="Cancelled Opportunities Dashboard" icon-name="standard:opportunity">

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="slds-m-around_large slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading cancelled opportunities" size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error -->
        <template if:true={error}>
            <div class="slds-m-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{error}</h2>
                </div>
            </div>
        </template>

        <template if:false={isLoading}>
            <template if:false={error}>
                <div class="slds-m-around_medium">

                    <!-- Summary Cards -->
                    <div class="slds-grid slds-gutters slds-m-bottom_medium">
                        <div class="slds-col slds-size_1-of-3">
                            <div class="summary-card">
                                <div class="summary-label">Total Cancelled</div>
                                <div class="summary-value">{totalCount}</div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <div class="summary-card">
                                <div class="summary-label">Total Amount Lost</div>
                                <div class="summary-value">{totalAmountFormatted}</div>
                            </div>
                        </div>
                        <div class="slds-col slds-size_1-of-3">
                            <div class="summary-card">
                                <div class="summary-label">Most Recent Cancellation</div>
                                <div class="summary-value summary-value_date">{lastCancelledDateFormatted}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Filters -->
                    <div class="slds-grid slds-gutters slds-m-bottom_medium slds-wrap">
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <lightning-input
                                type="search"
                                label="Search by Name or Account"
                                value={searchTerm}
                                onchange={handleSearch}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                            <lightning-input
                                type="date"
                                label="Cancelled From"
                                value={filterStartDate}
                                onchange={handleStartDateChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                            <lightning-input
                                type="date"
                                label="Cancelled To"
                                value={filterEndDate}
                                onchange={handleEndDateChange}>
                            </lightning-input>
                        </div>
                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                            <lightning-combobox
                                label="Stage"
                                options={stageOptions}
                                value={filterStage}
                                onchange={handleStageChange}>
                            </lightning-combobox>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <template if:true={isEmpty}>
                        <div class="slds-illustration slds-illustration_small slds-m-vertical_large">
                            <div class="slds-text-longform slds-text-align_center">
                                <h3 class="slds-text-heading_medium">No cancelled opportunities found</h3>
                                <p class="slds-text-body_regular slds-text-color_weak">
                                    Try adjusting your filters or check back later.
                                </p>
                            </div>
                        </div>
                    </template>

                    <!-- Data Table -->
                    <template if:true={hasRecords}>
                        <lightning-datatable
                            key-field="id"
                            data={filteredData}
                            columns={columns}
                            sorted-by={sortedBy}
                            sorted-direction={sortedDirection}
                            onsort={handleSort}
                            default-sort-direction="desc"
                            hide-checkbox-column>
                        </lightning-datatable>

                        <div class="slds-m-top_small slds-grid slds-grid_align-spread">
                            <span class="slds-text-body_small slds-text-color_weak">
                                Showing {filteredCount} of {totalCount} opportunities
                            </span>
                            <lightning-button
                                label="Export to CSV"
                                icon-name="utility:download"
                                icon-position="left"
                                onclick={handleExport}>
                            </lightning-button>
                        </div>
                    </template>

                </div>
            </template>
        </template>

    </lightning-card>
</template>
